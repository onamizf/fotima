<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 — Лаборатория элементов</title><style>
:root{--bg:#1F6BFF;--bg-glow:radial-gradient(circle at 50% 55%,#4D8DFF 0%,#1F6BFF 45%,#0F4FD9 100%);--text:#fff;--card:rgba(255,255,255,.12);--card-solid:#fff;--accent-dark:#0B1E4A}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg-glow);color:var(--text);font-family:Arial,sans-serif}main{text-align:center;padding:32px}h1{font-family:'Inter Tight',Arial,sans-serif;font-weight:900;font-size:120px;margin:0}p{font-size:20px}a{display:inline-block;margin-top:20px;padding:14px 24px;border-radius:999px;background:var(--card-solid);color:var(--accent-dark);font-size:13px;font-weight:800;text-decoration:none;text-transform:uppercase}
</style></head><body><main><h1>404</h1><p>Страница не найдена</p><a id="home" href="./#welcome">На главную</a></main><script>
// Неизвестные физические пути также возвращают в подпапку проекта GitHub Pages.
const root=new URL(location.pathname.startsWith('/fotima/')?'/fotima/':'/',location.origin);document.getElementById('home').href=new URL('#welcome',root).href;const font=new FontFace('Inter Tight',`url(${new URL('assets/InterTight-Black.ttf',root)})`,{weight:'900'});font.load().then(value=>document.fonts.add(value)).catch(()=>{});
</script></body></html>
